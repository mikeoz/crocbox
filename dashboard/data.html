<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CROCbox — My Data</title>
<link rel="stylesheet" href="/shared/style.css">
<style>
  .room-list { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .room-list { grid-template-columns: 1fr; } }
  .room-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px 22px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .room-card:hover { border-color: var(--accent-dim); }
  .room-card.closed { opacity: 0.6; border-color: var(--danger, #c0392b); }
  .room-icon { font-size: 28px; margin-bottom: 8px; }
  .room-name { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
  .room-meta { font-size: 13px; color: var(--text-dim); display: flex; gap: 12px; align-items: center; }
  .room-meta .closed-badge { color: var(--danger, #c0392b); font-weight: 600; }
  .detail-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    z-index: 100; align-items: center; justify-content: center;
  }
  .detail-overlay.visible { display: flex; }
  .detail-panel {
    background: var(--surface); border-radius: var(--radius-lg);
    padding: 28px 32px; max-width: 560px; width: 90%; max-height: 80vh;
    overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  .detail-panel h2 { margin: 0 0 4px; font-size: 20px; }
  .detail-path { font-family: var(--font-mono, monospace); font-size: 13px; color: var(--text-dim); margin-bottom: 16px; }
  .detail-stats { display: flex; gap: 20px; margin-bottom: 16px; font-size: 14px; }
  .detail-stats span { color: var(--text-dim); }
  .detail-stats strong { color: var(--text); }
  .door-btn {
    padding: 10px 20px; border: none; border-radius: var(--radius);
    font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; margin-bottom: 16px;
  }
  .door-btn.close { background: var(--danger, #c0392b); color: #fff; }
  .door-btn.open { background: var(--accent, teal); color: #fff; }
  .history-section h3 { font-size: 15px; margin: 0 0 8px; }
  .history-list { max-height: 240px; overflow-y: auto; }
  .history-entry {
    font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between;
  }
  .history-entry .action { font-weight: 500; }
  .history-entry .result-allowed { color: var(--accent, teal); }
  .history-entry .result-blocked { color: var(--danger, #c0392b); }
  .history-entry .time { color: var(--text-dim); font-size: 12px; }
  .add-room-bar { margin-top: 16px; display: flex; gap: 8px; }
  .add-room-bar input {
    flex: 1; padding: 8px 12px; border: 1px solid var(--border);
    border-radius: var(--radius); background: var(--surface); color: var(--text); font-size: 14px;
  }
  .add-room-bar button {
    padding: 8px 16px; background: var(--accent, teal); color: #fff;
    border: none; border-radius: var(--radius); font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .empty-state { text-align: center; padding: 48px 0; color: var(--text-dim); }
  .back-link { font-size: 13px; color: var(--accent, teal); cursor: pointer; margin-bottom: 12px; display: inline-block; }
</style>
</head>
<body>
<div class="container" style="max-width: 720px; margin: 0 auto; padding: 24px;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h1 style="margin: 0; font-size: 22px;">My Data</h1>
    <span style="font-size: 13px; color: var(--text-dim);">Rooms in your building — where your data lives</span>
  </div>

  <div id="loading" style="text-align: center; padding: 32px; color: var(--text-dim);">Loading Data Rooms…</div>
  <div id="empty" class="empty-state" style="display:none;">
    <p style="font-size: 18px;">No Data Rooms configured.</p>
    <p>Data Rooms will be created automatically on first run.</p>
  </div>
  <div id="roomList" class="room-list" style="display:none;"></div>

  <div class="add-room-bar" id="addBar" style="display:none;">
    <input type="text" id="addName" placeholder="Room name (e.g., Projects)">
    <input type="text" id="addPath" placeholder="Full path (e.g., /Users/you/Projects)">
    <button id="addBtn">Add Room</button>
  </div>
</div>

<!-- Detail overlay -->
<div class="detail-overlay" id="detailOverlay">
  <div class="detail-panel">
    <span class="back-link" id="detailClose">← Back to rooms</span>
    <h2 id="detailName"></h2>
    <div class="detail-path" id="detailPath"></div>
    <div class="detail-stats">
      <span>Files: <strong id="detailCount">—</strong></span>
      <span>Status: <strong id="detailStatus">—</strong></span>
    </div>
    <button class="door-btn" id="doorBtn"></button>
    <div class="history-section">
      <h3>Access History</h3>
      <div class="history-list" id="historyList">
        <div style="color: var(--text-dim); font-size: 13px;">Loading…</div>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  const $loading = document.getElementById('loading');
  const $empty   = document.getElementById('empty');
  const $list    = document.getElementById('roomList');
  const $addBar  = document.getElementById('addBar');
  const $overlay = document.getElementById('detailOverlay');
  let rooms = [];
  let selectedRoom = null;

  async function loadRooms() {
    try {
      const res = await fetch('/api/data-rooms');
      const data = await res.json();
      $loading.style.display = 'none';
      if (!data.success || !data.rooms || data.rooms.length === 0) {
        $empty.style.display = 'block';
        return;
      }
      rooms = data.rooms;
      renderRooms();
      $list.style.display = 'grid';
      $addBar.style.display = 'flex';
    } catch (err) {
      console.error('[DATA] Load failed:', err);
      $loading.style.display = 'none';
      $empty.style.display = 'block';
    }
  }

  function renderRooms() {
    $list.innerHTML = rooms.map((r, i) => {
      const closedClass = r.closed ? ' closed' : '';
      const closedBadge = r.closed ? '<span class="closed-badge">🔒 Closed</span>' : '';
      return `<div class="room-card${closedClass}" data-idx="${i}">
        <div class="room-icon">${r.closed ? '🔒' : '📁'}</div>
        <div class="room-name">${esc(r.name)}</div>
        <div class="room-meta">
          <span>${r.fileCount || 0} files</span>
          ${r.isDefault ? '<span>Default</span>' : '<span>Custom</span>'}
          ${closedBadge}
        </div>
      </div>`;
    }).join('');
  }

  $list.addEventListener('click', (e) => {
    const card = e.target.closest('.room-card');
    if (!card) return;
    const idx = parseInt(card.dataset.idx);
    if (isNaN(idx) || !rooms[idx]) return;
    showDetail(rooms[idx]);
  });

  async function showDetail(room) {
    selectedRoom = room;
    document.getElementById('detailName').textContent = room.name;
    document.getElementById('detailPath').textContent = room.path;
    document.getElementById('detailCount').textContent = room.fileCount || 0;
    document.getElementById('detailStatus').textContent = room.closed ? '🔒 Closed' : '✅ Open';
    const doorBtn = document.getElementById('doorBtn');
    if (room.closed) {
      doorBtn.textContent = 'Open the Door';
      doorBtn.className = 'door-btn open';
    } else {
      doorBtn.textContent = 'Close the Door';
      doorBtn.className = 'door-btn close';
    }
    $overlay.classList.add('visible');
    // Load history
    const histEl = document.getElementById('historyList');
    histEl.innerHTML = '<div style="color: var(--text-dim); font-size: 13px;">Loading…</div>';
    try {
      const res = await fetch(`/api/data-rooms/history?id=${encodeURIComponent(room.id)}`);
      const data = await res.json();
      if (!data.success || !data.history || data.history.length === 0) {
        histEl.innerHTML = '<div style="color: var(--text-dim); font-size: 13px;">No access history yet.</div>';
      } else {
        histEl.innerHTML = data.history.reverse().map(e => {
          const resultClass = (e.result === 'allowed' || e.result === 'completed') ? 'result-allowed' : 'result-blocked';
          const time = e.timestamp ? new Date(e.timestamp).toLocaleString() : '—';
          return `<div class="history-entry">
            <span class="action">${esc(e.action || '—')}</span>
            <span class="${resultClass}">${esc(e.result || '—')}</span>
            <span class="time">${esc(time)}</span>
          </div>`;
        }).join('');
      }
    } catch {
      histEl.innerHTML = '<div style="color: var(--text-dim); font-size: 13px;">Could not load history.</div>';
    }
  }

  document.getElementById('doorBtn').addEventListener('click', async () => {
    if (!selectedRoom) return;
    const endpoint = selectedRoom.closed ? '/api/data-rooms/open' : '/api/data-rooms/close';
    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: selectedRoom.id })
      });
      const data = await res.json();
      if (data.success) {
        $overlay.classList.remove('visible');
        loadRooms();
      }
    } catch (err) {
      console.error('[DATA] Door toggle failed:', err);
    }
  });

  document.getElementById('detailClose').addEventListener('click', () => {
    $overlay.classList.remove('visible');
  });

  document.getElementById('addBtn').addEventListener('click', async () => {
    const name = document.getElementById('addName').value.trim();
    const roomPath = document.getElementById('addPath').value.trim();
    if (!name || !roomPath) return;
    try {
      const res = await fetch('/api/data-rooms', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, path: roomPath })
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById('addName').value = '';
        document.getElementById('addPath').value = '';
        loadRooms();
      } else {
        alert(data.error || 'Failed to add room');
      }
    } catch (err) {
      alert('Failed to add room: ' + err.message);
    }
  });

  function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
  loadRooms();
})();
</script>
</body>
</html>
